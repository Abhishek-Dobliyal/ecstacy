[project]
name = "ecstacy-tui"
version = "0.10.7"
description = "A Textual TUI for beautiful terminal data visualization from files, REST endpoints and more."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Abhishek Dobliyal", email = "abhishek.dobliyal1512@gmail.com"},
]
keywords = [
    "tui",
    "terminal",
    "visualization",
    "csv",
    "dataframe",
    "sql",
    "charts",
    "textual",
    "data",
    "duckdb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.2.8,<9",
    "textual-plotext>=1.0.1,<2",
    "plotext>=5.3.2,<6",
    "pandas>=3.0.5,<4",
    "numpy>=2.4.3,<3",
    "pyarrow>=25.0.0,<26",
    "duckdb>=1.5.5,<2",
    "httpx>=0.28.1,<1",
    "orjson>=3.11.9,<4",
    "pyyaml>=6.0.3,<7",
    "typer>=0.27.0,<1",
    "pyfiglet>=1.0.4,<2",
    "pydantic>=2.13.4,<3",
    "websockets>=16.1.1,<17",
    "openpyxl>=3.1,<4",
    "tabulate>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/Abhishek-Dobliyal/ecstacy"
Repository = "https://github.com/Abhishek-Dobliyal/ecstacy"
Issues = "https://github.com/Abhishek-Dobliyal/ecstacy/issues"
Changelog = "https://github.com/Abhishek-Dobliyal/ecstacy/blob/main/CHANGELOG.md"

[project.scripts]
ecstacy = "ecstacy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "textual-dev>=1.5.1",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecstacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "bench: performance budgets (opt-in via --benchmark-only or -m bench)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
