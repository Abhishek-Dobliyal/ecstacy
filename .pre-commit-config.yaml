repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [check]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - textual>=8.2.8
          - pandas>=3.0.5
          - numpy>=2.4.3
          - pydantic>=2.13.4
          - typer>=0.27.0
          - httpx>=0.28.1
        files: ^src/
